name: Rust

concurrency:
  group: ${{ github.repository }}-${{ github.head_ref || github.sha }}-${{ github.workflow }}
  cancel-in-progress: true

on:
  push:
    branches-ignore:
      - 'gh-readonly-queue/**'
      - 'dependabot/**'
    paths-ignore:
      - "docs/**"
      - "**.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/pull_request_template.md"
  # manual trigger
  # https://docs.github.com/en/actions/managing-workflow-runs/manually-running-a-workflow
  workflow_dispatch:

jobs:
  # Check crate compiles and base cargo check passes
  linux-build-lib:
    name: linux build test
    runs-on: ubuntu-latest
    container:
      image: amd64/rust
    steps:
      - uses: runs-on/action@17b59092eb37ebfdbb034460892887c09100eaa3  # v2.5.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-builder
        with:
          rust-version: stable
      - name: Rust Dependency Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          shared-key: "amd-ci-check" # Keep cargo check artifacts separate from test builds.
          save-if: ${{ github.ref_name == 'main' }}
      - name: Prepare cargo build
        # `--locked` asserts that Cargo.lock is up to date with the manifest.
        run: cargo xtask ci step check workspace

  # Library and integration tests
  linux-test:
    name: cargo test (amd64)
    runs-on: ubuntu-latest
    container:
      image: amd64/rust
      volumes:
        - /usr/local:/host/usr/local
    steps:
      - name: Remove unnecessary preinstalled software
        run: |
          echo "Disk space before cleanup:"
          df -h
          # remove tool cache: about 8.5GB (github has host /opt/hostedtoolcache mounted as /__t)
          rm -rf /__t/* || true
          # remove Haskell runtime: about 6.3GB (host /usr/local/.ghcup)
          rm -rf /host/usr/local/.ghcup || true
          # remove Android library: about 7.8GB (host /usr/local/lib/android)
          rm -rf /host/usr/local/lib/android || true
          echo "Disk space after cleanup:"
          df -h
      - uses: runs-on/action@17b59092eb37ebfdbb034460892887c09100eaa3  # v2.5.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: true
          fetch-depth: 1
      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-builder
        with:
          rust-version: stable
      - name: Rust Dependency Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          save-if: ${{ github.ref_name == 'main' }}
          shared-key: "amd-ci"
      - name: Run tests (excluding doctests and datafusion-cli)
        env:
          RUST_BACKTRACE: 1
        run: |
          cargo test \
            --profile ci \
            --exclude datafusion-examples \
            --exclude ffi_example_table_provider \
            --exclude datafusion-cli \
            --workspace \
            --lib \
            --tests \
            --bins \
            --features serde,avro,json,backtrace,integration-tests,parquet_encryption,substrait
      - parallel:
          - name: Verify Working Directory Clean
            run: git diff --exit-code
          # Check no temporary directories created during test.
          # `false/` folder is excuded for rust cache.
          - name: Verify Working Directory Clean (No Untracked Files)
            run: |
              STATUS="$(git status --porcelain | sed -e '/^?? false\/$/d' -e '/^?? false$/d')"
              if [ -n "$STATUS" ]; then
                echo "$STATUS"
                exit 1
              fi

  # verify that the benchmark queries return the correct results
  verify-benchmark-results:
    name: verify benchmark results (amd64)
    runs-on: ubuntu-latest
    container:
      image: amd64/rust
    steps:
      - uses: runs-on/action@17b59092eb37ebfdbb034460892887c09100eaa3  # v2.5.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: true
          fetch-depth: 1
      - parallel:
          - name: Setup Rust toolchain
            uses: ./.github/actions/setup-builder
            with:
              rust-version: stable
          - name: Generate benchmark data and expected query results
            run: |
              mkdir -p datafusion/sqllogictest/test_files/tpch/data
              git clone https://github.com/databricks/tpch-dbgen.git
              cd tpch-dbgen
              make
              ./dbgen -f -s 0.1
              mv *.tbl ../datafusion/sqllogictest/test_files/tpch/data
      - name: Verify that benchmark queries return expected results
        run: |
          cargo xtask ci step test benchmark-plan
          cargo xtask ci step test benchmark-sqllogic
      - name: Verify Working Directory Clean
        run: git diff --exit-code

  check-fmt:
    name: Check cargo fmt
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rustup
      - name: Run
        run: |
          ci/scripts/rust_fmt.sh

  check-workflow-tool-installs:
    name: Check GitHub Actions install tooling
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Check workflow tool installs
        run: ci/scripts/check_no_cargo_install_in_workflows.sh

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    container:
      image: amd64/rust
    steps:
      - uses: runs-on/action@17b59092eb37ebfdbb034460892887c09100eaa3  # v2.5.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: true
          fetch-depth: 1
      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-builder
        with:
          rust-version: stable
      - parallel:
          - name: Install Clippy
            run: rustup component add clippy
          - name: Rust Dependency Cache
            uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
            with:
              save-if: ${{ github.ref_name == 'main' }}
              shared-key: "amd-ci-clippy"
      - name: Install CMake
        # The all-features check builds snmalloc-sys, which requires CMake.
        run: apt-get install -y --no-install-recommends cmake
      - name: Run clippy
        run: ci/scripts/rust_clippy.sh
